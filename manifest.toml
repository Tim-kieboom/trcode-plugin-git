id = "git"
name = "Git"
version = "0.2.1"
abi = "1.4"
wasm = "git.wasm"
capabilities = ["git.read", "git.write", "git.remote", "editor.open"]

[[action]]
id = "up"
title = "Previous File"
keys = "up"

[[action]]
id = "down"
title = "Next File"
keys = "down"

[[action]]
id = "open"
title = "Open File"
keys = "enter"

[[action]]
id = "stage"
title = "Stage File"
keys = "s"

[[action]]
id = "unstage"
title = "Unstage File"
keys = "u"

[[action]]
id = "refresh"
title = "Refresh"
keys = "r"

[[action]]
id = "stage_all"
title = "Stage All"
keys = "a"

[[action]]
id = "unstage_all"
title = "Unstage All"
keys = "shift+a"

[[action]]
id = "commit"
title = "Commit"
keys = "c"

[[action]]
id = "more"
title = "More Buttons"
keys = "m"

[[action]]
id = "fetch"
title = "Fetch"
keys = "f"

[[action]]
id = "pull"
title = "Pull"
keys = "p"

[[action]]
id = "push"
title = "Push"
keys = "shift+p"
